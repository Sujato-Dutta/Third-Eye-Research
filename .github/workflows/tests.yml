name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python -m ruff check src experiments tests
      - run: python -m ruff format --check src experiments tests
      - run: python -m pytest -q
      - run: python experiments/verify_backend.py --device cpu
